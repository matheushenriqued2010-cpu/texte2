<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Você aceita se casar comigo?</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0620;--panel:#1a0f3a;--violet:#a78bfa;--blue:#60a5fa;--ink:#d9cfff;--dark:#14083a;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0620}}
:root[data-theme="dark"]{--bg:#0d0620}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,#07030f 0%,#1a0b45 55%,#0d0620 100%) fixed var(--bg);color:var(--ink);
font-family:'Pixelify Sans','Courier New',monospace;display:flex;justify-content:center;min-height:100vh;min-height:100dvh;padding:28px 16px 36px;overflow-x:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{position:relative;z-index:1;width:100%;max-width:430px}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sky::before{content:"";position:absolute;inset:-20%;background:radial-gradient(40% 35% at 20% 22%,rgba(124,58,237,.5),transparent 70%),radial-gradient(38% 32% at 82% 38%,rgba(59,130,246,.4),transparent 70%),radial-gradient(45% 35% at 40% 88%,rgba(168,85,247,.4),transparent 70%);animation:drift 18s ease-in-out infinite alternate}
.sky::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(4,1,12,.75))}
@keyframes drift{to{transform:translate(4%,3%) scale(1.1)}}
.sky .s{position:absolute;background:#efeaff;animation:tw 3s ease-in-out infinite}
.sky .f{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.55}90%{opacity:.4}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.px{width:1em;height:1em;fill:currentColor;display:inline-block}
.hero{position:relative;z-index:2;margin-bottom:-56px;text-align:center}
.hero img{width:100%;max-width:420px;height:auto;display:block;margin:0 auto;
filter:drop-shadow(0 0 5px #c4b5fd) drop-shadow(0 0 14px rgba(167,139,250,.95)) drop-shadow(0 0 28px rgba(96,165,250,.6))}
.d{position:absolute;color:var(--violet);animation:tw 2.6s ease-in-out infinite;text-shadow:0 0 8px currentColor}
.d.b{color:var(--blue)}
@keyframes tw{50%{opacity:.25;transform:scale(.8)}}
.sign{position:relative;padding:44px 20px 26px;text-align:center;background:var(--panel);border-radius:22px;
border:3px solid var(--violet);box-shadow:0 0 0 5px var(--panel),0 0 0 8px var(--blue),0 0 34px 8px rgba(96,165,250,.45),inset 0 0 26px rgba(167,139,250,.35)}
.corner{position:absolute;top:60px;font-size:30px;color:var(--violet)}
.corner.l{left:16px}.corner.r{right:16px}
h1{margin:14px 0 14px;font-size:clamp(1.7rem,8vw,2.2rem);line-height:1.15;font-weight:600;color:#e9e2ff;text-shadow:0 0 12px var(--violet)}
.line{height:2px;margin:0 auto 14px;background:linear-gradient(90deg,transparent,var(--violet),var(--blue),transparent)}
.msg{margin:0 0 16px;font-size:1.1rem;line-height:1.5}
.sep{display:flex;align-items:center;gap:8px;color:var(--violet);margin-top:4px}
.sep::before,.sep::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--violet))}
.sep::after{transform:scaleX(-1)}
.sep .px{font-size:26px}
.btns{margin-top:22px;display:flex;flex-direction:column;gap:14px}
.slot{height:60px}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;font:inherit;font-weight:600;font-size:1.4rem;width:100%;height:60px;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 22px;transition:transform .15s}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#sim{border:3px solid #efeaff;color:var(--dark);background:linear-gradient(135deg,var(--violet),var(--blue));box-shadow:0 0 22px rgba(139,92,246,.7)}
@media (hover:hover){#sim:hover{transform:scale(1.03)}}
#nao{border:3px solid var(--violet);color:var(--ink);background:#0b0420}
#nao.run{position:fixed;z-index:20;width:auto;justify-content:center;gap:10px;padding:0 20px}
.foot{display:flex;align-items:center;gap:10px;margin-top:22px;color:var(--ink);justify-content:center}
.foot::before,.foot::after{content:"";flex:1;height:2px;background:var(--violet)}
.foot .px{font-size:34px;color:var(--violet)}
.ok{display:none}
.done .ask{display:none}.done .ok{display:block}
.ok .msg{font-size:1.25rem}
.heart{position:fixed;top:100%;pointer-events:none;animation:up linear forwards;z-index:9}
@keyframes up{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
@media (max-width:400px){body{padding:18px 12px 28px}.sign{padding:40px 14px 22px}.corner{font-size:24px;top:54px}.corner.l{left:10px}.corner.r{right:10px}.msg{font-size:1rem}button{font-size:1.2rem;height:54px;padding:0 16px}.slot{height:54px}.hero{margin-bottom:-44px}}
@media (prefers-reduced-motion:reduce){.d,.sky::before,.sky .s,.sky .f{animation:none}}
</style>
</head>

      <p class="msg">Eu quero passar o resto<br>da minha vida ao seu lado...<br>Para sempre ♡</p>

<script>
(function(){var sk=document.getElementById('sky'),i,e,z;
for(i=0;i<80;i++){e=document.createElement('i');e.className='s';z=Math.random()<.2?3:2;e.style.cssText='width:'+z+'px;height:'+z+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;animation-delay:'+Math.random()*3+'s;opacity:'+(.3+Math.random()*.6);sk.appendChild(e);}
for(i=0;i<16;i++){e=document.createElement('div');e.className='f';var s=14+Math.random()*22;e.style.cssText='left:'+Math.random()*100+'%;font-size:'+s+'px;color:'+(i%2?'#60a5fa':'#a78bfa')+';animation-duration:'+(14+Math.random()*14)+'s;animation-delay:'+(-Math.random()*20)+'s';e.innerHTML=i%3?'<svg class="px"><use href="#h"/></svg>':'✦';sk.appendChild(e);}
})();
var nao=document.getElementById('nao'),sim=document.getElementById('sim'),nt=document.getElementById('nt'),tries=0;
var msgs=['Não...?','Tem certeza?','Pensa de novo 🥺','Clica no Sim ♡','Por favorzinho'];
function fuga(e){
  if(e&&e.preventDefault)e.preventDefault();
  tries++;nt.textContent=msgs[Math.min(tries,msgs.length-1)];
  nao.classList.add('run');
  var w=nao.offsetWidth,h=nao.offsetHeight;
  nao.style.left=Math.max(8,Math.random()*(window.innerWidth-w-16))+'px';
  nao.style.top=Math.max(8,Math.random()*(window.innerHeight-h-16))+'px';
  sim.style.transform='scale('+Math.min(1+tries*.05,1.15)+')';
}
nao.addEventListener('mouseenter',fuga);
nao.addEventListener('touchstart',fuga,{passive:false});
nao.addEventListener('click',fuga);
sim.addEventListener('click',function(){
  document.getElementById('sign').classList.add('done');
  nao.style.display='none';
  var c=['💜','💙','🖤','💍','✨'];
  for(var i=0;i<45;i++){(function(i){setTimeout(function(){
    var h=document.createElement('div');h.className='heart';h.textContent=c[i%c.length];
    h.style.left=Math.random()*100+'vw';h.style.fontSize=(18+Math.random()*26)+'px';
    h.style.animationDuration=(3+Math.random()*3)+'s';document.body.appendChild(h);
    setTimeout(function(){h.remove()},6500);},i*90);})(i);}
});
</script>
